name: Template validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Install locked dependencies
        run: corepack pnpm@10.34.4 install --frozen-lockfile
      - name: Install Chromium
        run: corepack pnpm@10.34.4 exec playwright install --with-deps chromium
      - name: Validate
        run: corepack pnpm@10.34.4 validate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
